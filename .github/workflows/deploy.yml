name: Deploy to GitHub Pages

# push 到 main 时自动构建并发布 dist/（本项目产物是单个 dist/index.html）
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 官方发布流程需要的权限，一个都不能少
permissions:
  contents: read   # checkout 源码
  pages: write     # 创建 Pages 部署
  id-token: write  # deploy-pages 用它签 OIDC token

# 同一时间只跑一个发布，新的 push 取消正在排队的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
